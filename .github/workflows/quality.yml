name: Evidence quality and teacher workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject empty and unsupported knowledge evidence
        run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
